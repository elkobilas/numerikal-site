<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Hikma YouTube thumbnail template">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1a2340"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A67C2E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F5E6A3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- Left side: text area (2/3) -->
  <rect x="0" y="0" width="850" height="720" fill="url(#bg)"/>
  <!-- Right side: image placeholder (1/3) -->
  <rect x="850" y="0" width="430" height="720" fill="#1a2340" opacity="0.5"/>
  <text x="1065" y="360" text-anchor="middle" font-family="Helvetica" font-size="24" fill="#D4AF37" opacity="0.5">[IMAGE]</text>
  <!-- Gold accent bar -->
  <rect x="0" y="0" width="8" height="720" fill="url(#gold)"/>
  <!-- Title text -->
  <text x="60" y="200" font-family="Georgia, serif" font-size="52" font-weight="700" fill="url(#gold)" letter-spacing="2">TITRE DE LA VIDÉO</text>
  <text x="60" y="270" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#F5F1E8" opacity="0.85">Sous-titre ou description courte</text>
  <!-- Hikma branding -->
  <g transform="translate(60, 600)">
    <path d="M10 2 C7 5, 6 8, 8 11 C6 10, 4 11, 4 14 C4 18, 8 21, 13 21 C18 21, 22 18, 22 14 C22 11, 20 10, 18 11 C20 8, 19 5, 16 2 C15 4, 14 4, 10 2 Z" fill="url(#gold)" transform="scale(1.5)"/>
  </g>
  <text x="110" y="640" font-family="Georgia, serif" font-size="32" font-weight="700" fill="url(#gold)" letter-spacing="3">HIKMA</text>
  <!-- Bottom bar -->
  <rect x="0" y="690" width="1280" height="30" fill="url(#gold)" opacity="0.3"/>
  <text x="640" y="712" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#0B132B" font-weight="600">HISTOIRE · SAVOIR · SAGESSE</text>
</svg>